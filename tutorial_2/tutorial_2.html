<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial 3: Grid Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-layout">
  <header class="site-header">
    <nav class="header-nav">
      <!-- Style this flexible nav component -->
      <span class="logo">Site Name</span>
      <ul class="nav-links">
        <li><a href="#">Link</a></li>
        <li><a href="#">Link</a></li>
        <li><a href="#">Link</a></li>
      </ul>
    </nav>
  </header>
  <main class="hero-section">
    <h1>Hero Headline</h1>
    <p>Supporting text for the hero section goes here.</p>
  </main>
  
  <section class="list-section"> <!--- List of cards -->
    <div class="list-item"> <!--- card1-->
      <!--- Image-->
      <img src="images/truman.JPG" alt="golden retriever, happy dog head out of the window" width="150" height="150"/>

      <!-- Add your repeating component in here -->
      <div class="card-rightbox">
        
        <div class="header-box">
            <h2>Card Title</h2>
            <date class="date">September 18, 2025</date>
        
          </div>
        
        <p class="card-description">Card description goes here.</p>
      </div> <!--/.card-rightbox-->
    </div> <!--/.list-item-->

    <div class="list-item"> <!--- card2-->
